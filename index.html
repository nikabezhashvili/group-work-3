<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="original.css">
</head>

<body>
    <header>
        <div>
            <div id="hd1">
                <img src="./images/logo.svg">
            </div>
            <div id="hd2">
                <p>SCORE</p>
                <h2 id="score">12</h2>
            </div>
        </div>
    </header>
    <main>
        <div id="choose">
            <div id="start_preview">
                <div id="top">
                    <div id="topl" class="chos">
                        <img src="./images/icon-paper.svg">
                    </div>
                    <div id="topr" class="chos">
                        <img src="./images/icon-scissors.svg">
                    </div>
                </div>
                <div id="bottom" class="chos">
                    <img src="./images/icon-rock.svg">
                </div>
            </div>
        </div>
        <div id="for_game">
            <div id="game_proces">
                <div id="left">
                    <p>YOU PICKED</p>
                    <div id="ld">
                        <img src="" id="user_choose">
                    </div>
                </div>
                <div id="middle">
                    <div>
                        <h2 id="text">YOU WIN</h2>
                        <button id="play_again_btn">PLAY AGAIN</button>
                    </div>
                </div>
                <div id="right">
                    <p>THE HOUSE PICKED</p>
                    <div id="rd">
                        <img src="" id="computer_choose">
                    </div>
                </div>
            </div>
        </div>
        <div id="rule">
            <div id="content">
                <div id="ctop">
                    <h2>RULES</h2>
                    <img src="./images/icon-close.svg" id="close">
                </div>
                <div id="cbottom">
                    <img src="./images/image-rules.svg" alt="" >
                </div>
            </div>
        </div>
    </main>
    <footer>
        <button id="btn1" onclick="window.location.href='bonus.html'">change game version</button>
        <button id="btn2">RULES</button>
    </footer>
    <script src="original.js"></script>
</body>

</html>
